[workspace]
name = "rookery-pds"
version = "0.2.0"
description = "Rookery PDS fork with freeq SASL auth support, deployable to Fly.io"
authors = ["nandi"]
license = "MIT"
channels = [
    "https://prefix.dev/pixi-experimental-backends",
    "https://prefix.dev/conda-forge",
]
platforms = ["linux-64", "osx-arm64"]
preview = ["pixi-build"]

[package]
name = "rookery-pds"
version = "0.2.0"
description = "Rookery PDS fork with freeq SASL auth support"
authors = ["nandi"]
license = "MIT"
publish = true

[package.build.backend]
name = "pixi-build-nodejs"
version = ">=0.1.0"

[package.build.config]
# Use npm to build the Node.js app
package-manager = "npm"

[package.host-dependencies]
nodejs = ">=22"

[package.run-dependencies]
nodejs = ">=22"

[dependencies]
nodejs = ">=22"
flyctl = "*"

[tasks]
# Cloudflare Workers (operator only; `pixi run cf-login` once). See docs/cloudflare.md.
# --ignore-scripts: deploying needs no native builds (wrangler's optional sharp would compile from source).
cf-install = "npm ci --ignore-scripts"
cf-login = { cmd = "node_modules/.bin/wrangler login", depends-on = ["cf-install"] }
cf-deploy = { cmd = "node_modules/.bin/wrangler deploy -c wrangler.cloudflare.jsonc", depends-on = ["cf-install"] }
# Prompts for CLOUDFLARE_DNS_TOKEN (Zone DNS Edit on latha.org) and CLOUDFLARE_ZONE_ID; generates OAUTH_NONCE_SECRET.
cf-secrets = { cmd = "node_modules/.bin/wrangler secret put CLOUDFLARE_DNS_TOKEN -c wrangler.cloudflare.jsonc && node_modules/.bin/wrangler secret put CLOUDFLARE_ZONE_ID -c wrangler.cloudflare.jsonc && node -e \"process.stdout.write(require('crypto').randomBytes(32).toString('hex'))\" | node_modules/.bin/wrangler secret put OAUTH_NONCE_SECRET -c wrangler.cloudflare.jsonc", depends-on = ["cf-install"] }
cf-logs = { cmd = "node_modules/.bin/wrangler tail -c wrangler.cloudflare.jsonc", depends-on = ["cf-install"] }
# FROM=... TO=... ROOKERY_OPERATOR_TOKEN=... pixi run migrate-host [did ...]
migrate-host = "node scripts/migrate-host.mjs"
# One machine only: a single celld node owns the bucket's fleet.
deploy = "flyctl deploy --remote-only --ha=false"
# MINIO_ROOT_USER=... MINIO_ROOT_PASSWORD=... pixi run fly-secrets
fly-secrets = "flyctl secrets set -a rookery-pds MINIO_ROOT_USER=$MINIO_ROOT_USER MINIO_ROOT_PASSWORD=$MINIO_ROOT_PASSWORD"
build = "pixi build"
publish = "pixi publish --to https://prefix.dev/channels/nandi-testing"
