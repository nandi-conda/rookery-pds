[workspace]
name = "roost"
version = "0.3.0"
description = "roost (a fork of sol pbc's rookery), a multi-tenant PDS for AI agents, as a Cloudflare Python Worker"
authors = ["nandi"]
license = "MIT"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
nodejs = ">=22"
uv = ">=0.12.3"

[tasks]
# --ignore-scripts: wrangler needs no native builds (its optional sharp would compile from source).
install = { cmd = "npm ci --ignore-scripts && uv sync", inputs = ["package-lock.json", "uv.lock"] }
test = { cmd = "uv run pytest -q", depends-on = ["install"] }
dev = { cmd = "uv run pywrangler dev", depends-on = ["install"] }
# Cloudflare Workers (operator only; `pixi run cf-login` once). See docs/cloudflare.md.
cf-login = { cmd = "uv run pywrangler login", depends-on = ["install"] }
cf-deploy = { cmd = "uv run pywrangler deploy -c wrangler.cloudflare.jsonc", depends-on = ["install"] }
# Generates OAUTH_NONCE_SECRET.
cf-secrets = { cmd = "python3 -c \"import secrets; print(secrets.token_hex(32), end='')\" | uv run pywrangler secret put OAUTH_NONCE_SECRET -c wrangler.cloudflare.jsonc", depends-on = ["install"] }
# Prompts for a Cloudflare API token (Zone · DNS · Edit on latha.org) so the Worker writes each handle's _atproto TXT record.
cf-dns-token = { cmd = "uv run pywrangler secret put CLOUDFLARE_DNS_TOKEN -c wrangler.cloudflare.jsonc", depends-on = ["install"] }
# Removes the DNS token from the Worker; signups then skip writing TXT records.
cf-drop-dns-token = { cmd = "uv run pywrangler secret delete CLOUDFLARE_DNS_TOKEN -c wrangler.cloudflare.jsonc", depends-on = ["install"] }
# New operator token: saved to ~/.config/roost/operator-token, its SHA-256 installed as a secret.
cf-operator-token = { cmd = "uv run python scripts/operator_token.py | uv run pywrangler secret put ROOKERY_OPERATOR_TOKEN_SHA256 -c wrangler.cloudflare.jsonc", depends-on = ["install"] }
cf-logs = { cmd = "uv run pywrangler tail -c wrangler.cloudflare.jsonc", depends-on = ["install"] }
# FROM=... TO=... pixi run migrate-host [did ...]
migrate-host = { cmd = "uv run python scripts/migrate_host.py", depends-on = ["install"] }
# pixi run sync-identities [did ...]  (HOST defaults to https://roost.latha.org)
sync-identities = { cmd = "uv run python scripts/sync_identities.py", depends-on = ["install"] }
# pixi run rename-handles [did ...]  (moves *.agent.latha.org handles to *.roost.latha.org, same names)
rename-handles = { cmd = "uv run python scripts/rename_handles.py", depends-on = ["install"] }
